name: "Setup Node, pnpm, and safe-chain"
description: |
  Install Node (from .node-version), pnpm (from packageManager in package.json),
  and AikidoSec Safe Chain. Run this before any pnpm install step.

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: pnpm
        registry-url: "https://registry.npmjs.org"

    - name: Aikido Safe Chain age policy
      shell: bash
      run: |
        # 48h is Safe Chain's default minimum package age. Set it explicitly so
        # agents and future action edits cannot silently drop the floor to 0.
        # The only age-check exclusion is first-party @aptos-labs/* packages.
        # Do not add other names, and do not pass --safe-chain-skip-minimum-package-age.
        echo "SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS=48" >> "${GITHUB_ENV}"
        echo "SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS=@aptos-labs/*" >> "${GITHUB_ENV}"

    - name: Setup AikidoSec Safe Chain
      shell: bash
      # Installed directly instead of via aptos-labs/actions/aikidosec-safe-chain.
      # That action is pinned to Safe Chain 1.4.7, which dies with
      # "Safe-chain: Uncaught exception: unexpected end of file" whenever it has to
      # verify a lockfile from scratch. CI always verifies from scratch (no
      # ~/.safe-chain to reuse), so the proxy died before serving any tarball and
      # every install on a cache-missing lockfile failed. 1.5.20 hits the same
      # response-body condition but recovers ("forwarding it unmodified") instead of
      # throwing. Move back to the shared action once it ships a current version.
      #
      # Pin an exact release: the installer verifies the binary checksum, and `--ci`
      # puts the Safe Chain shims on PATH so every later pnpm call is wrapped.
      run: |
        curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.20/install-safe-chain.sh | sh -s -- --ci
