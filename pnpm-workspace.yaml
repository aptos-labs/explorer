registry: https://registry.npmjs.org/

autoInstallPeers: true
strictPeerDependencies: false

# Supply-chain mitigation: refuse to install package versions newer than this
# many minutes. 7200 minutes = 5 days, giving the npm registry / community
# time to detect compromised or malicious releases before they enter our
# dependency graph. See https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 7200

# Narrow exceptions for packages whose currently-locked version sits inside
# the 5-day window. Audit each entry on bump and remove it once the locked
# version is comfortably older than the cutoff. See
# https://pnpm.io/settings#minimumreleaseageexclude
minimumReleaseAgeExclude: []

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": true
  esbuild: true
  sharp: false

overrides:
  "@aptos-labs/wallet-standard": 2.0.0
  "@aptos-labs/ts-sdk": 7.2.0
  "@babel/core": 7.29.7
  "@opentelemetry/core": 2.10.0
  "@opentelemetry/propagator-jaeger": 2.10.0
  axios: 1.19.0
  brace-expansion: 5.0.9
  esbuild: 0.28.1
  form-data: 4.0.6
  js-yaml: 5.2.3
  postcss: 8.5.26
  sharp: 0.35.3
  svgo: 4.0.2
  tar: 7.5.22
  tmp: 0.2.7
  d3-array: 3.2.4
  d3-color: 3.1.0
  d3-dispatch: 3.0.1
  d3-drag: 3.0.0
  d3-ease: 3.0.1
  d3-interpolate: 3.0.1
  defu: 6.1.7
  fast-uri: 4.1.2
  h3-v2: npm:h3@2.0.1-rc.26
  d3-geo: 3.1.1
  d3-selection: 3.0.0
  d3-timer: 3.0.1
  d3-transition: 3.0.1
  d3-zoom: 3.0.0
  "@tootallnate/once": 3.0.1
  lodash: 4.18.1
  node-forge: 1.4.0
  uuid: 14.0.0
  undici: 7.29.0
  nanoid: 6.0.1

patchedDependencies:
  "@netlify/edge-functions-dev@1.0.23": patches/@netlify__edge-functions-dev@1.0.23.patch

resolutionMode: highest
