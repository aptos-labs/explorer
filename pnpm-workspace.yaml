registry: https://registry.npmjs.org/

autoInstallPeers: true
strictPeerDependencies: false

# pnpm 12 otherwise prepends an environment document to pnpm-lock.yaml.
# GitHub's dependency graph currently reads that document as an empty project
# graph. Keep the lockfile scanner-compatible; package.json, .tool-versions,
# and pnpm/action-setup still pin the exact pnpm version used by CI.
pmOnFail: ignore

# Supply-chain mitigation: refuse to install package versions newer than this
# many minutes. 7200 minutes = 5 days, giving the npm registry / community
# time to detect compromised or malicious releases before they enter our
# dependency graph. See https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 7200

# Narrow exceptions for packages whose currently-locked version sits inside
# the 5-day window. Audit each entry on bump and remove it once the locked
# version is comfortably older than the cutoff. See
# https://pnpm.io/settings#minimumreleaseageexclude
minimumReleaseAgeExclude:
  [
    # TanStack Start 1.0 family. Published 2026-10-16. Inside pnpm 5-day gate.
    # Remove after 2026-10-21.
    "@tanstack/react-start@1.169.3",
    "@tanstack/react-router@1.170.45",
    "@tanstack/react-start-client@1.168.43",
    "@tanstack/react-start-rsc@0.1.64",
    "@tanstack/react-start-server@1.167.51",
    "@tanstack/router-core@1.171.38",
    "@tanstack/router-plugin@1.168.47",
    "@tanstack/router-cli@1.167.45",
    "@tanstack/router-generator@1.167.45",
    "@tanstack/start-client-core@1.170.38",
    "@tanstack/start-plugin-core@1.171.54",
    "@tanstack/start-server-core@1.169.44",
    "@tanstack/start-storage-context@1.167.40",

    # TanStack Query 5.104.4 family. Published 2026-10-17. Inside pnpm 5-day gate.
    # Remove after 2026-10-22.
    "@tanstack/query-core@5.104.4",
    "@tanstack/query-devtools@5.104.4",
    "@tanstack/react-query@5.104.4",
    "@tanstack/react-query-devtools@5.104.4",

    # TanStack Virtual 3.14.21. Published 2026-10-16. Inside pnpm 5-day gate.
    # Remove after 2026-10-21.
    "@tanstack/react-virtual@3.14.21",
    "@tanstack/virtual-core@3.19.6",

    # Vitest 5.0.5 family. Published 2026-10-15. Inside pnpm 5-day gate.
    # Remove after 2026-10-20.
    "vitest@5.0.5",
    "@vitest/coverage-v8@5.0.5",
    "@vitest/mocker@5.0.5",
    "@vitest/spy@5.0.5",

    # Direct dependency updates inside pnpm 5-day gate.
    # baseline-browser-mapping held at 2.11.27 until 2.11.29 clears Safe Chain 48h floor.
    # browserslist held at 4.29.3 until 4.29.4 clears Safe Chain 48h floor.
    # js-yaml held at 5.4.2 until 5.5.0 clears Safe Chain 48h floor.
    # postcss held at 8.5.28 until 8.5.31 clears Safe Chain 48h floor.
    # undici held at 8.11.2 until 8.12.2 clears Safe Chain 48h floor.
    "jsdom@30.1.3",

    # Transitive dependency updates inside pnpm 5-day gate.
    "argparse@3.0.3",
    "electron-to-chromium@1.5.459",
    "node-releases@2.0.59",
    "@asamuzakjp/dom-selector@10.0.3",
  ]

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": true
  esbuild: true
  sharp: false

overrides:
  "@aptos-labs/wallet-standard": 2.0.0
  "@aptos-labs/ts-sdk": 7.5.0
  "@babel/core": 8.0.10
  "@babel/traverse": 8.0.10
  "@opentelemetry/core": 3.0.0
  "@opentelemetry/propagator-jaeger": 2.12.0
  axios: 1.21.0
  baseline-browser-mapping: 2.11.34
  brace-expansion: 5.0.12
  browserslist: 4.29.5
  esbuild: 0.28.2
  form-data: 4.0.6
  "@fastify/busboy": 3.2.4
  image-size: 2.0.4
  js-yaml: 5.5.0
  postcss: 8.5.32
  sharp: 0.35.5
  svgo: 4.1.0
  tar: 7.5.22
  tmp: 0.2.7
  d3-array: 3.2.4
  d3-color: 3.1.0
  d3-dispatch: 3.0.1
  d3-drag: 3.0.0
  d3-ease: 3.0.1
  d3-interpolate: 3.0.1
  defu: 6.1.7
  fast-uri: 4.2.3
  h3-v2: npm:h3@2.0.8
  d3-geo: 3.1.1
  d3-selection: 3.0.0
  d3-timer: 3.0.1
  d3-transition: 3.0.1
  d3-zoom: 3.0.0
  "@tootallnate/once": 3.0.1
  lodash: 4.18.1
  node-forge: 1.4.2
  uuid: 14.0.3
  undici: 8.11.2
  nanoid: 6.0.2
  http-cache-semantics: 4.3.0
  # CVE-2026-104846 / GHSA-p6vx-979v-rg4c. solid-js 1.9.15 still resolves
  # seroval@1.5.6 (affected: >=0.12.0 <1.6.2). Pin the patched line so every
  # copy, including that Solid tree, stays on 1.6.8.
  seroval: 1.6.8
  seroval-plugins: 1.7.6

patchedDependencies:
  "@babel/core@8.0.6": patches/@babel__core@8.0.6.patch
  "@babel/traverse@8.0.6": patches/@babel__traverse@8.0.6.patch
  "http-cache-semantics@4.2.0": patches/http-cache-semantics@4.2.0.patch

# The advisory range is still `<=4.2.0`, so `pnpm audit` matches the locked
# version even after the patch above. Valid only while that patch is applied.
audit:
  ignore:
    - GHSA-ch52-4w7c-c8xp

resolutionMode: highest
