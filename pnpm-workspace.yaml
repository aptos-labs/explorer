registry: https://registry.npmjs.org/

autoInstallPeers: true
strictPeerDependencies: false

# pnpm 12 otherwise prepends an environment document to pnpm-lock.yaml.
# GitHub's dependency graph currently reads that document as an empty project
# graph. Keep the lockfile scanner-compatible; package.json, .tool-versions,
# and pnpm/action-setup still pin the exact pnpm version used by CI.
pmOnFail: ignore

# Supply-chain mitigation: refuse to install package versions newer than this
# many minutes. 7200 minutes = 5 days, giving the npm registry / community
# time to detect compromised or malicious releases before they enter our
# dependency graph. See https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 7200

# Narrow exceptions for packages whose currently-locked version sits inside
# the 5-day window. Audit each entry on bump and remove it once the locked
# version is comfortably older than the cutoff. See
# https://pnpm.io/settings#minimumreleaseageexclude
minimumReleaseAgeExclude: []

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": true
  esbuild: true
  sharp: false

overrides:
  "@aptos-labs/wallet-standard": 2.0.0
  "@aptos-labs/ts-sdk": 7.5.0
  "@babel/core": 8.1.2
  "@babel/traverse": 8.1.2
  "@opentelemetry/core": 3.1.1
  "@opentelemetry/propagator-jaeger": 2.12.1
  axios: 1.21.1
  baseline-browser-mapping: 2.11.38
  brace-expansion: 5.0.13
  browserslist: 4.29.6
  esbuild: 0.28.2
  form-data: 4.0.6
  "@fastify/busboy": 3.2.6
  image-size: 2.1.0
  js-yaml: 5.5.0
  postcss: 8.5.33
  sharp: 0.35.5
  svgo: 4.1.0
  tar: 7.5.23
  tmp: 0.2.7
  d3-array: 3.2.5
  d3-color: 3.1.1
  d3-dispatch: 3.0.2
  d3-drag: 3.0.1
  d3-ease: 3.0.2
  d3-interpolate: 3.0.2
  defu: 6.1.7
  fast-uri: 4.2.3
  h3-v2: npm:h3@2.0.8
  d3-geo: 3.1.2
  d3-selection: 3.0.1
  d3-timer: 3.0.2
  d3-transition: 3.0.2
  d3-zoom: 3.0.1
  "@tootallnate/once": 3.0.1
  lodash: 4.18.1
  node-forge: 1.4.3
  uuid: 14.0.3
  undici: 8.12.4
  nanoid: 6.0.2
  http-cache-semantics: 4.3.0
  # CVE-2026-104846 / GHSA-p6vx-979v-rg4c. solid-js 1.9.15 still resolves
  # seroval@1.5.6 (affected: >=0.12.0 <1.6.2). Pin the patched line so every
  # copy, including that Solid tree, stays on a release past 1.6.2.
  # 1.8.2 clears the 5-day minimumReleaseAge gate and satisfies
  # seroval-plugins@1.8.0.
  seroval: 1.8.2
  seroval-plugins: 1.8.0

patchedDependencies:
  "@babel/core@8.1.2": patches/@babel__core@8.1.2.patch
  "@babel/traverse@8.1.2": patches/@babel__traverse@8.1.2.patch
  # Upstream 4.3.0 is outside advisory range <=4.2.0 but does not fix
  # CVE-2026-93748. This patch keeps the shared-cache refusal on 4.3.0.
  "http-cache-semantics@4.3.0": patches/http-cache-semantics@4.3.0.patch

resolutionMode: highest
