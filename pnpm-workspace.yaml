registry: https://registry.npmjs.org/

autoInstallPeers: true
strictPeerDependencies: false

# pnpm 12 otherwise prepends an environment document to pnpm-lock.yaml.
# GitHub's dependency graph currently reads that document as an empty project
# graph. Keep the lockfile scanner-compatible; package.json, .tool-versions,
# and pnpm/action-setup still pin the exact pnpm version used by CI.
pmOnFail: ignore

# Supply-chain mitigation: refuse to install package versions newer than this
# many minutes. 7200 minutes = 5 days, giving the npm registry / community
# time to detect compromised or malicious releases before they enter our
# dependency graph. See https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 7200

# Narrow exceptions for packages whose currently-locked version sits inside
# the 5-day window. Audit each entry on bump and remove it once the locked
# version is comfortably older than the cutoff. See
# https://pnpm.io/settings#minimumreleaseageexclude
minimumReleaseAgeExclude:
  [
    # CVE-2026-102989 reflected XSS in TanStack Start server functions.
    # Patched line published 2026-09-29/30, past Safe Chain's 48h floor but still
    # inside the 5-day minimumReleaseAge gate. Remove after 2026-10-05.
    "@tanstack/react-start@1.168.60",
    "@tanstack/react-router@1.170.41",
    "@tanstack/react-store@0.11.2",
    "@tanstack/store@0.11.2",
    "@tanstack/router-core@1.171.34",
    "@tanstack/router-plugin@1.168.42",
    "@tanstack/router-cli@1.167.40",
    "@tanstack/router-generator@1.167.40",
    "@tanstack/react-start-rsc@0.1.59",
    "@tanstack/react-start-client@1.168.39",
    "@tanstack/react-start-server@1.167.46",
    "@tanstack/start-client-core@1.170.34",
    "@tanstack/start-plugin-core@1.171.49",
    "@tanstack/start-server-core@1.169.39",
    "@tanstack/start-storage-context@1.167.36",
    # First-party Aptos SDK; Safe Chain already exempts @aptos-labs/* from its
    # 48h floor. The 7.4.0 release (2026-10-05) is inside pnpm's 5-day gate.
    # Remove once it is older than 2026-10-10.
    "@aptos-labs/ts-sdk@7.4.0",
  ]

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": true
  esbuild: true
  sharp: false

overrides:
  "@aptos-labs/wallet-standard": 2.0.0
  "@aptos-labs/ts-sdk": 7.5.0
  "@babel/core": 8.0.7
  "@opentelemetry/core": 2.12.0
  "@opentelemetry/propagator-jaeger": 2.12.0
  axios: 1.20.0
  baseline-browser-mapping: 2.11.28
  brace-expansion: 5.0.12
  browserslist: 4.29.3
  esbuild: 0.28.2
  form-data: 4.0.6
  "@fastify/busboy": 3.2.3
  image-size: 2.0.4
  js-yaml: 5.4.3
  postcss: 8.5.29
  sharp: 0.35.5
  svgo: 4.1.0
  tar: 7.5.22
  tmp: 0.2.7
  d3-array: 3.2.4
  d3-color: 3.1.0
  d3-dispatch: 3.0.1
  d3-drag: 3.0.0
  d3-ease: 3.0.1
  d3-interpolate: 3.0.1
  defu: 6.1.7
  fast-uri: 4.2.2
  h3-v2: npm:h3@2.0.2
  d3-geo: 3.1.1
  d3-selection: 3.0.0
  d3-timer: 3.0.1
  d3-transition: 3.0.1
  d3-zoom: 3.0.0
  "@tootallnate/once": 3.0.1
  lodash: 4.18.1
  node-forge: 1.4.0
  uuid: 14.0.3
  undici: 8.11.2
  nanoid: 6.0.2
  # CVE-2026-104846 / GHSA-p6vx-979v-rg4c. solid-js 1.9.15 still resolves
  # seroval@1.5.6 (affected: >=0.12.0 <1.6.2). Pin the patched line so every
  # copy, including that Solid tree, stays on 1.6.8.
  seroval: 1.6.9
  seroval-plugins: 1.6.9

patchedDependencies:
  "@babel/core@8.0.6": patches/@babel__core@8.0.6.patch
  "@babel/traverse@8.0.6": patches/@babel__traverse@8.0.6.patch
  # CVE-2026-93748 / GHSA-ch52-4w7c-c8xp. Upstream 4.3.0 (2026-10-04) is still
  # inside Safe Chain's 48h floor and does not change the max-stale path.
  # This patch closes that path on the locked 4.2.0. Drop it when an upstream
  # release both fixes the behavior and clears the age gates.
  "http-cache-semantics@4.2.0": patches/http-cache-semantics@4.2.0.patch

# The advisory range is still `<=4.2.0`, so `pnpm audit` matches the locked
# version even after the patch above. Valid only while that patch is applied.
audit:
  ignore:
    - GHSA-ch52-4w7c-c8xp

resolutionMode: highest
